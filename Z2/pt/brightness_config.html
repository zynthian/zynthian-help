 <h1>Configuração do brilho</h1>
    <p>Esta vista permite ajustar o brilho da interface de utilizador. O botão 1 ajusta a retroiluminação do ecrã e o botão 2 ajusta a intensidade dos LED dos botões de hardware. Esta configuração é puramente visual e não tem qualquer impacto no funcionamento do sistema.</p>
