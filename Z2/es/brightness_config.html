 <h1>Configuración del brillo</h1>
    <p>Esta vista permite ajustar el brillo de la interfaz de usuario. El knob 1 ajusta la retroiluminación de la pantalla y el knob 2 ajusta la intensidad de los LED de los botones de hardware. Estos ajustes son puramente visuales y no afectan al funcionamiento del sistema.</p>
